name: "Copilot Setup Steps"

# Allows manual validation and validates changes to this workflow automatically.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Set the permissions to the lowest permissions possible needed for *your steps*. Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read
    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Node.js tooling
        run: |
          node --version
          npm --version
          npx --version

      # The published 2.10.0 package lacks the tool annotations required by
      # Copilot's MCP proxy. Pin the upstream revision that includes them.
      - name: Install Azure DevOps MCP server
        run: |
          npm install --global "github:microsoft/azure-devops-mcp#52072ff41bb8849af9f19a85a260aa1b52824158"
          command -v mcp-server-azuredevops

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium and Edge)
        working-directory: frontend
        run: npx playwright install chromium msedge

      - name: Install gh-aw extension
        uses: github/gh-aw/actions/setup-cli@v0.41.1
        with:
          version: v0.41.1
